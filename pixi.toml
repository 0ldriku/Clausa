# The environments of `./clausa setup` (runner/setup_envs.py), with the pins of
# runner/requirements/. pixi.lock holds every package's exact version and build;
# setup installs it with --locked. After a change here: `pixi lock`, then check
# the outputs byte for byte (docs/development.md, "Environments").

[workspace]
name = "clausa"
channels = ["conda-forge"]
# osx-arm64 for macOS 14, the oldest the app supports: MLX's wheels are its builds.
platforms = [{ name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" }, "win-64", "linux-64"]
requires-pixi = ">=0.83.0"

# qwen3-asr: Qwen3-ASR, English clause segmentation, Stage 4.
[feature.asr.dependencies]
python = "==3.12.12"
pip = "*"

[feature.asr.pypi-dependencies]
flask = "==3.1.2"
joblib = "==1.5.3"
librosa = "==0.11.0"
numpy = "==2.3.5"
pandas = "==3.0.0"
praatio = "==6.2.2"
qwen-asr = "==0.0.6"
scikit-learn = "==1.8.0"
scipy = "==1.17.0"
soundfile = "==0.13.1"
spacy = "==3.8.11"
spacy-alignments = "==0.9.2"
spacy-transformers = "==1.3.9"
transformers = "==4.57.6"
fugashi = "==1.5.2"
unidic-lite = "==1.0.8"
av = "==19.0.1"

# spacy-transformers 1.3.9 asks for transformers below 4.50; as in the paper's
# environment, it runs beside the newer one qwen-asr needs.
[feature.asr.pypi-options.dependency-overrides]
transformers = "==4.57.6"

# Apple Silicon: Stage 1 through MLX on the Mac GPU, and the app window.
[feature.asr.target.osx-arm64.pypi-dependencies]
mlx = "==0.32.3"
mlx-metal = "==0.32.3"
mlx-qwen3-asr = "==0.4.4"
nagisa = "==0.2.11"  # the version qwen-asr pins
pywebview = "==6.2.1"

# Windows: the app window through WebView2.
[feature.asr.target.win-64.pypi-dependencies]
pywebview = "==6.2.1"
pythonnet = "==3.0.5"  # the release pywebview 6.2.1 came out against

# PyTorch for qwen3-asr. The paper used cu121; RTX 50xx GPUs need cu128.
[feature.torch-cuda.target.osx-arm64.pypi-dependencies]
torch = "==2.5.1"
torchaudio = "==2.5.1"

[feature.torch-cuda.target.win-64.pypi-dependencies]
torch = { version = "==2.8.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.8.0+cu128", index = "https://download.pytorch.org/whl/cu128" }

[feature.torch-cuda.target.linux-64.pypi-dependencies]
torch = { version = "==2.8.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.8.0+cu128", index = "https://download.pytorch.org/whl/cu128" }

[feature.torch-cpu.pypi-dependencies]
torch = "==2.5.1"
torchaudio = "==2.5.1"

# mfa: Montreal Forced Aligner 3.3.9, conda-forge only.
[feature.mfa.dependencies]
python = "==3.10.19"
pip = "*"
montreal-forced-aligner = "==3.3.9"
spacy = "==3.8.14"
sudachipy = "==0.6.11"
sudachidict-core = "==20260116"

# MFA aligns on the CPU: Kaldi's CPU build, as on Linux and macOS. With an
# NVIDIA driver present, the solver would otherwise pick its CUDA build.
[feature.mfa.target.win-64.dependencies]
kaldi = { build = "cpu*" }
libblas = { build = "*openblas" }

# ja-electra310: GiNZA-Electra for Japanese clause segmentation.
[feature.ja.dependencies]
python = "==3.10.11"
pip = "*"

[feature.ja.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cpu" }
click = "==8.5.0"
ginza = "==5.2.0"
ja-ginza-electra = "==5.2.0"
numpy = "==2.2.6"
pandas = "==2.3.3"
praatio = "==6.2.2"
protobuf = "==3.20.3"
safetensors = "==0.7.0"
scipy = "==1.15.3"
sentencepiece = "==0.2.1"
spacy-transformers = "==1.1.9"
spacy = "==3.8.11"
sudachidict-core = "==20260116"
sudachipy = "==0.6.10"
transformers = "==4.25.1"

[environments]
# On Windows and Linux qwen3-asr has CUDA's PyTorch, qwen3-asr-cpu the CPU build
# (setup picks one by nvidia-smi, or --torch); on the Mac they are the same.
qwen3-asr = { features = ["asr", "torch-cuda"], no-default-feature = true }
qwen3-asr-cpu = { features = ["asr", "torch-cpu"], no-default-feature = true }
mfa = { features = ["mfa"], no-default-feature = true }
ja-electra310 = { features = ["ja"], no-default-feature = true }
